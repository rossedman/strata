name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # publish the GitHub release
      id-token: write      # keyless cosign signing and provenance
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never build a release from a restored cache
      - name: Test
        run: go test -count=1 ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # DuckDB is linked through cgo, so every platform needs its own C
      # toolchain. goreleaser-cross bundles them (gcc for Linux, osxcross
      # for macOS, mingw for Windows). cosign is mounted in, and the OIDC
      # request variables are passed through so keyless signing works.
      - name: Build, sign and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/goreleaser/goreleaser-cross:v1.27.3-v2.18.3@sha256:1820cee53c4c06cfb43c2203caca73f9497042f5b6061c8916a251228a321975
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_SHA -e GITHUB_SERVER_URL \
            -e GITHUB_WORKFLOW_REF -e GITHUB_RUN_ID \
            -v "$(command -v cosign)":/usr/local/bin/cosign:ro \
            -v "$PWD":/src -w /src \
            "$IMAGE" release --clean
          sudo chown -R "$(id -u):$(id -g)" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
