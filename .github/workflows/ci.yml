name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Lint the OpenAPI spec
        run: |
          set -euo pipefail
          go install github.com/daveshanley/vacuum@v0.36.0
          vacuum lint -d -r .vacuum.yaml api/openapi.yaml
      - name: One command per file
        run: ./tools/check-cmds.sh
      - name: Doc comments
        run: go run ./tools/doccheck ./...
      - name: Generated code is current
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code -- internal/api pkg/client

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Coverage gate (hand-written code, 90%)
        run: make cover
      - name: Benchmark smoke run
        run: go test -run='^$' -bench=. -benchtime=1x ./...

  bench:
    name: Benchmarks
    # Compares crawl, refresh and write benchmarks against the base branch
    # and posts the benchstat table to the job summary. Shared runners are
    # too noisy to fail on timings; request counts, which are exact, are
    # gated by TestRequestBudget in the test job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BENCH: "Crawl|Recrawl|Refresh|Write"
      PKGS: "./internal/crawl ./internal/service ./internal/store"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmark the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          cd "$RUNNER_TEMP/base"
          # shellcheck disable=SC2086 # PKGS is a list of packages
          go test -run='^$' -bench="$BENCH" -benchmem -benchtime=3x -count=6 $PKGS > "$RUNNER_TEMP/old.txt" ||
            echo "The base branch has no comparable benchmarks; showing this PR's numbers alone."
      - name: Benchmark this PR
        run: |
          # shellcheck disable=SC2086 # PKGS is a list of packages
          go test -run='^$' -bench="$BENCH" -benchmem -benchtime=3x -count=6 $PKGS | tee "$RUNNER_TEMP/new.txt"
      - name: Compare
        run: |
          {
            echo "## Benchmarks against the base branch"
            echo
            echo '```'
            if [ -s "$RUNNER_TEMP/old.txt" ]; then
              go tool benchstat base="$RUNNER_TEMP/old.txt" pr="$RUNNER_TEMP/new.txt"
            else
              go tool benchstat "$RUNNER_TEMP/new.txt"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/chain, target: FuzzIDs }
          - { pkg: ./internal/query, target: FuzzCompile }
          - { pkg: ./internal/crawl, target: FuzzRedact }
          - { pkg: ./internal/crawl, target: FuzzGlob }
          - { pkg: ./internal/graph, target: FuzzBudget }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz for 30s
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s "$PKG"

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-check:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
