openapi: 3.0.3
info:
  title: strata API
  version: 1.0.0
  description: |
    Read-only API over a strata index: what an image is, where it came from,
    what is built on it and whether it is stale. Every response schema is
    versioned under /v1; breaking changes get a new prefix.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:7878
    description: strata serve on its default local address
tags:
  - name: images
    description: One image and its lineage
  - name: reports
    description: Queries and aggregate reports
  - name: system
    description: Server health
  - name: ui
    description: Aggregated, paged views that back the web UI
paths:
  /v1/healthz:
    get:
      operationId: getHealth
      summary: Report server health and index size
      tags: [system]
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /v1/resolve:
    get:
      operationId: resolveRef
      summary: Resolve a ref to a platform manifest digest
      tags: [images]
      parameters:
        - $ref: "#/components/parameters/Ref"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: The digest the ref names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolved"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/images/{digest}:
    get:
      operationId: getImage
      summary: Explain one image
      description: Labels, config, layers, referrers, lineage with provenance and the staleness verdict with reasons.
      tags: [images]
      parameters:
        - name: digest
          in: path
          required: true
          description: Manifest digest, or a unique digest prefix of at least 12 hex characters
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{12,64}$"
        - name: history
          in: query
          required: false
          description: Include the build steps from the config history
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/ancestry:
    get:
      operationId: getAncestry
      summary: Walk an image's ancestry to its root base
      tags: [images]
      parameters:
        - $ref: "#/components/parameters/Ref"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: The ancestry chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/descendants:
    get:
      operationId: getDescendants
      summary: Find everything built on a base
      tags: [images]
      parameters:
        - $ref: "#/components/parameters/Ref"
        - $ref: "#/components/parameters/Platform"
        - name: depth
          in: query
          required: false
          description: Levels below the base; 0 means the whole subtree
          schema:
            type: integer
            minimum: 0
            default: 1
        - name: all_versions
          in: query
          required: false
          description: Match every digest the base tag has held
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Budget"
      responses:
        "200":
          description: The descendant graph and base versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescendantResult"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/query:
    get:
      operationId: runQuery
      summary: Filter images with the query language
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - name: fields
          in: query
          required: false
          description: Columns to return
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          required: false
          description: Fields to sort by; a leading - sorts descending
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: Maximum rows; 0 means all
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 1000
        - $ref: "#/components/parameters/GroupBy"
      responses:
        "200":
          description: Matching rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/query/graph:
    get:
      operationId: getQueryGraph
      summary: Draw the images a filter matches plus their ancestry
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Budget"
      responses:
        "200":
          description: The query graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/stale:
    get:
      operationId: getStale
      summary: Report the staleness mix
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/GroupBy"
      responses:
        "200":
          description: Verdict counts per group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/roots:
    get:
      operationId: getRoots
      summary: List root bases and their descendant counts
      tags: [reports]
      responses:
        "200":
          description: Root bases, most-used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Root"
        default:
          $ref: "#/components/responses/Error"
  /v1/summary:
    get:
      operationId: getSummary
      summary: Footprint summary of the registry
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/GroupBy"
      responses:
        "200":
          description: Footprint metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/overview:
    get:
      operationId: getOverview
      summary: Registry overview for the web UI
      description: Headline counts, the staleness mix, the root bases holding the most stale images, and changes in the last week.
      tags: [ui]
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        default:
          $ref: "#/components/responses/Error"
  /v1/status:
    get:
      operationId: getStatus
      summary: Progress of the running index
      description: |
        Whether `strata serve` is crawling, how far it has got, and when the
        views were last refreshed. While a long crawl runs, the other UI
        endpoints answer from what is indexed so far.
      tags: [ui]
      responses:
        "200":
          description: The index status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/outline:
    get:
      operationId: getOutline
      summary: One level of the lineage outline
      description: |
        Children of an outline node. With no parent, the root bases. Children
        with descendants come back as base rows; leaf images are grouped into
        one row per repo, and a repo row's children are its images, paged.
      tags: [ui]
      parameters:
        - name: parent
          in: query
          required: false
          description: Outline row id to expand; empty for the roots
          schema:
            type: string
        - name: only_stale
          in: query
          required: false
          description: Only rows holding stale or abandoned images
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outline"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/search:
    get:
      operationId: search
      summary: Filter images with facet counts
      description: |
        Runs a filter, applies the selected facet values, and returns one page
        of images plus counts for every facet. Each facet's counts apply every
        selection except its own, so choosing a value never hides the others.
      tags: [ui]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - name: team
          in: query
          required: false
          description: Selected label.team values
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: root
          in: query
          required: false
          description: Selected root bases
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: verdict
          in: query
          required: false
          description: Selected verdicts
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: platform
          in: query
          required: false
          description: Selected platforms
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: age
          in: query
          required: false
          description: Selected age buckets
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: ["< 30 days", "30–180 days", "180 days–1 year", "> 1 year", "unknown"]
        - name: pushed
          in: query
          required: false
          description: Selected push-age buckets, from registries that report push times (ECR)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: ["< 30 days", "30–180 days", "180 days–1 year", "> 1 year", "unknown"]
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of matches and the facet counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/map:
    get:
      operationId: getMap
      summary: Aggregated registry map
      description: Root bases and up to three levels below them, leaf images grouped by repo, capped to stay drawable at any registry size.
      tags: [ui]
      parameters:
        - name: depth
          in: query
          required: false
          description: Levels below the roots
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 3
      responses:
        "200":
          description: The map nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutlineRow"
        default:
          $ref: "#/components/responses/Error"
  /v1/cleanup:
    get:
      operationId: getCleanup
      summary: Images safe to delete and the storage deleting them frees
      description: |
        Deletion candidates: images matching `where` (abandoned ones by
        default), whole multi-platform indexes only, leaving out any a kept
        image is built on. `reclaimable_bytes` counts each layer once and
        only when no kept image uses it. `format=csv` exports every
        candidate.
      tags: [reports]
      parameters:
        - name: where
          in: query
          required: false
          description: Select candidates with the query language; empty means stale = "abandoned"
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Count a layer as freed when no kept image in the registry, or in the same repo, uses it
          schema:
            type: string
            enum: [registry, repo]
            default: registry
        - name: limit
          in: query
          required: false
          description: Most candidates and repos to list, largest first; totals count them all. 0 lists all.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: format
          in: query
          required: false
          description: json, or csv to export every candidate
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: The deletion candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cleanup"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/cleanup/lifecycle:
    get:
      operationId: getLifecycles
      summary: ECR lifecycle policies that expire what strata calls abandoned
      description: |
        One policy per repo expiring untagged images pushed more than the
        staleness policy's abandoned window ago, checked against the index.
        A repo where the rule would expire an image strata keeps gets no
        policy unless `include_conflicts` is set.
      tags: [reports]
      parameters:
        - name: repo
          in: query
          required: false
          description: Only repos matching these globs, with the host
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: days
          in: query
          required: false
          description: Expire untagged images pushed more than this many days ago; 0 uses the policy
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: include_conflicts
          in: query
          required: false
          description: Write a repo's rule even when it would expire images strata keeps
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A policy, or why there is none, per repo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lifecycle"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/kpis:
    get:
      operationId: getKPIHistory
      summary: The Overview's headline numbers per day
      description: Whole-index counts from the daily snapshots, oldest first. Snapshots start with the first refresh, so history cannot be backfilled.
      tags: [ui]
      parameters:
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: One entry per snapshot day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KPIDay"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/storage:
    get:
      operationId: getStorageHistory
      summary: Stored bytes over time by root base or repo
      description: |
        Each group's share of the deduplicated bytes per snapshot day: the
        largest groups by their latest size, the rest folded into one
        series. A layer several groups use is split between them, so the
        series add up to the deduplicated total.
      tags: [ui]
      parameters:
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [root, repo]
            default: root
        - name: top
          in: query
          required: false
          description: Groups charted on their own
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/activity:
    get:
      operationId: getActivity
      summary: Images pushed per day
      description: |
        Images per push day for the whole index or one repo, and the
        busiest repos in the window. Where the registry reports no push
        times, images are dated by their build time instead (`source` says
        which).
      tags: [ui]
      parameters:
        - name: repo
          in: query
          required: false
          description: Only this repo, by its full name
          schema:
            type: string
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: Pushes per day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/ages:
    get:
      operationId: getAges
      summary: Images by age and verdict
      description: Images bucketed by days since their push (or build), each bucket split by staleness verdict, with the query that selects it.
      tags: [ui]
      responses:
        "200":
          description: The buckets, youngest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ages"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/coverage:
    get:
      operationId: getBaseCoverage
      summary: How images were linked to their bases, per registry
      description: Per registry, images whose parent was found by shared layers, by build provenance or by a declared base; whose base is named but not indexed; whose base is unknown; and roots.
      tags: [ui]
      responses:
        "200":
          description: One row per registry, largest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coverage"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/adoption:
    get:
      operationId: getAdoption
      summary: Which releases of a base images are built on
      description: |
        A base repo's releases, newest first, with how many images in other
        repos are built directly on each. Without `base`, the repo most
        built on. `bases` lists the repos most built on, for picking one.
      tags: [ui]
      parameters:
        - name: base
          in: query
          required: false
          description: The base repo, by its full name
          schema:
            type: string
      responses:
        "200":
          description: The releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adoption"
        default:
          $ref: "#/components/responses/Error"
  /v1/charts/rollout:
    get:
      operationId: getRollout
      summary: How images moved between a base's releases over time
      description: |
        Per snapshot day, how many images in other repos were built
        directly on each of a base's newest releases, with older and deleted
        releases folded together.
      tags: [ui]
      parameters:
        - name: base
          in: query
          required: true
          description: The base repo, by its full name
          schema:
            type: string
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Days:
      name: days
      in: query
      required: false
      description: How many days back the chart reaches
      schema:
        type: integer
        minimum: 1
        maximum: 731
    Ref:
      name: ref
      in: query
      required: true
      description: repo:tag, repo@digest, a digest or a digest prefix
      schema:
        type: string
        minLength: 1
    Platform:
      name: platform
      in: query
      required: false
      description: Platform to pick when the ref names a multi-platform index, such as linux/arm64
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: A filter in strata's query language; empty matches every image
      schema:
        type: string
        default: ""
    GroupBy:
      name: group_by
      in: query
      required: false
      description: Field to group by, such as repo, root or label.team
      schema:
        type: string
    Budget:
      name: budget
      in: query
      required: false
      description: Maximum graph nodes
      schema:
        type: integer
        minimum: 1
        maximum: 20000
        default: 500
    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Rows to return
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
  responses:
    Error:
      description: "Unexpected error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No indexed image matches"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "The request is invalid, such as a filter syntax error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      description: "An error message"
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      description: "Server status and index size"
      type: object
      required: [status, version, images]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        images:
          type: integer
          format: int64
    Resolved:
      description: "A ref and the platform manifest digest it names"
      type: object
      required: [ref, digest]
      properties:
        ref:
          type: string
        digest:
          type: string
    Node:
      description: "A graph node: an image, an external root, a phantom ancestor not in the registry, or a collapsed group"
      type: object
      required: [id, label, kind, depth]
      properties:
        id:
          type: string
        label:
          type: string
        repo:
          type: string
        refs:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [image, external, phantom, collapsed, overflow]
        verdict:
          $ref: "#/components/schemas/Verdict"
        reasons:
          type: array
          items:
            type: string
        note:
          type: string
        created:
          type: string
        size:
          type: integer
          format: int64
        layers:
          type: integer
        depth:
          type: integer
        matched:
          type: boolean
        count:
          type: integer
        members:
          type: array
          items:
            type: string
        platform:
          type: string
    Edge:
      description: "A child-to-parent lineage edge with how it was found"
      type: object
      required: [parent, child, source]
      properties:
        parent:
          type: string
        child:
          type: string
        source:
          type: string
          enum: [layers, attestation, annotation, label]
        confidence:
          type: string
          enum: [exact, declared, inferred]
        conflict:
          type: boolean
    Graph:
      description: "A lineage graph: an ancestry chain, a descendant tree, a query graph or the registry map"
      type: object
      required: [kind, title, nodes, edges]
      properties:
        kind:
          type: string
          enum: [ancestry, descendants, query, map]
        root:
          type: string
        title:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        hidden:
          type: integer
    Verdict:
      description: "A staleness verdict; empty when not computed yet"
      type: string
      enum: ["", fresh, drifting, stale, abandoned]
    BaseVersion:
      description: "One digest a base tag has held, and how much is built on it"
      type: object
      required: [digest, label, source, confidence, current, children, descendants]
      properties:
        digest:
          type: string
        label:
          type: string
        source:
          type: string
          enum: [tag, tag_history, repo, file]
        confidence:
          type: string
          enum: [exact, declared, inferred]
        current:
          type: boolean
        children:
          type: integer
        descendants:
          type: integer
    DescendantResult:
      description: "A descendant graph and the base versions it starts from"
      type: object
      required: [graph, versions, images]
      properties:
        graph:
          $ref: "#/components/schemas/Graph"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/BaseVersion"
        images:
          type: integer
    Table:
      description: "Tabular rows with their column names"
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              description: A cell; null where the image has no value
              nullable: true
    Root:
      description: "A root base and how much descends from it"
      type: object
      required: [id, label, kind, children, descendants, stale_pct]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
        children:
          type: integer
        descendants:
          type: integer
        stale_pct:
          type: number
    GroupMetrics:
      description: "Footprint metrics for one group of images"
      type: object
      required: [group, repos, tags, manifests, unique_stacks, untagged_pct, apparent_bytes, dedup_bytes, exclusive_bytes, shared_cost_bytes, fresh, drifting, stale, abandoned]
      properties:
        group:
          type: string
        repos:
          type: integer
          format: int64
        tags:
          type: integer
          format: int64
        manifests:
          type: integer
          format: int64
        unique_stacks:
          type: integer
          format: int64
        untagged_pct:
          type: number
        apparent_bytes:
          type: integer
          format: int64
        dedup_bytes:
          type: integer
          format: int64
        exclusive_bytes:
          type: integer
          format: int64
        shared_cost_bytes:
          type: integer
          format: int64
        fresh:
          type: integer
          format: int64
        drifting:
          type: integer
          format: int64
        stale:
          type: integer
          format: int64
        abandoned:
          type: integer
          format: int64
    Summary:
      description: "Footprint summary of the registry, optionally grouped"
      type: object
      required: [total, platforms]
      properties:
        group_by:
          type: string
        total:
          $ref: "#/components/schemas/GroupMetrics"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupMetrics"
        platforms:
          type: object
          additionalProperties:
            type: integer
            format: int64
        required_label_coverage:
          type: object
          additionalProperties:
            type: number
    ImageInfo:
      description: "What the index knows about one image"
      type: object
      required: [digest, repo, label, tags, platform, size, layer_count, top_chain_id, external, labels, config]
      properties:
        digest:
          type: string
        repo:
          type: string
        label:
          type: string
        tags:
          type: array
          items:
            type: string
        index_digest:
          type: string
        platform:
          type: string
        platforms:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        age_days:
          type: integer
        pushed:
          type: string
          format: date-time
          description: When the registry says the image was first pushed (ECR only)
        first_seen:
          type: string
          format: date-time
          description: When strata first indexed the image
        size:
          type: integer
          format: int64
        layer_count:
          type: integer
        top_chain_id:
          type: string
        external:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
        config:
          $ref: "#/components/schemas/ConfigInfo"
    ConfigInfo:
      description: "Run-time fields from the image config; environment values are never stored except allowlisted ones"
      type: object
      required: [user, entrypoint, cmd, ports, env_keys, workdir, stop_signal, healthcheck]
      properties:
        user:
          type: string
        entrypoint:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: string
        env_keys:
          type: array
          items:
            type: string
        env_values:
          type: object
          additionalProperties:
            type: string
        workdir:
          type: string
        stop_signal:
          type: string
        healthcheck:
          type: boolean
    LayerInfo:
      description: "One layer and the build step that created it"
      type: object
      required: [position, diff_id, blob_digest, size, created_by, shared_by]
      properties:
        position:
          type: integer
        diff_id:
          type: string
        blob_digest:
          type: string
        size:
          type: integer
          format: int64
        created_by:
          type: string
        shared_by:
          type: integer
        added_by:
          type: string
          description: The ancestor whose build added this layer, an image digest or phantom id; unset when the image's own build did
    HistoryEntry:
      description: "One build step from the config history"
      type: object
      required: [created_by, empty_layer]
      properties:
        created_by:
          type: string
        empty_layer:
          type: boolean
    Referrer:
      description: "An artifact attached to an image, such as an SBOM or a signature"
      type: object
      required: [subject, digest, artifact_type, kind]
      properties:
        subject:
          type: string
        digest:
          type: string
        artifact_type:
          type: string
        kind:
          type: string
          enum: [sbom, signature, attestation, other]
    StalenessInfo:
      description: "A staleness verdict with the reasons behind it"
      type: object
      required: [verdict, reasons, base_drift_generations, untagged, inferred]
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        reasons:
          type: array
          items:
            type: string
        base_drift_generations:
          type: integer
        base_tag:
          type: string
        superseded_days:
          type: integer
        untagged:
          type: boolean
        inferred:
          type: boolean
    LineageInfo:
      description: "Where an image sits in the lineage graph, with the evidence for its parent"
      type: object
      required: [status, generation, children, descendants, conflict, edges, ancestry]
      properties:
        status:
          type: string
          enum: [derived, root, unknown]
        parent:
          type: string
        root:
          type: string
        generation:
          type: integer
        children:
          type: integer
        descendants:
          type: integer
        conflict:
          type: boolean
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        ancestry:
          $ref: "#/components/schemas/Graph"
        built_from:
          type: array
          description: "Images the build's provenance says it pulled, and whether each is indexed"
          items:
            $ref: "#/components/schemas/BuiltFrom"
    BuiltFrom:
      description: "An image a build pulled, by its BuildKit provenance"
      type: object
      required: [ref, status]
      properties:
        ref: { type: string, description: "repo:tag as the build named it" }
        digest: { type: string, description: "The digest the build resolved it to" }
        status:
          type: string
          enum: [parent, stage, missing, pending]
          description: "parent: built on it; stage: another build stage's image; missing: could not be fetched; pending: the next index fetches it"
        reason: { type: string, description: "Why a missing base could not be fetched" }
    Explanation:
      description: "Everything known about one image"
      type: object
      required: [image, lineage, staleness, layers, referrers, findings]
      properties:
        image:
          $ref: "#/components/schemas/ImageInfo"
        lineage:
          $ref: "#/components/schemas/LineageInfo"
        staleness:
          $ref: "#/components/schemas/StalenessInfo"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerInfo"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        referrers:
          type: array
          items:
            $ref: "#/components/schemas/Referrer"
        findings:
          type: array
          items:
            type: string
    VerdictCounts:
      description: "Images per verdict"
      type: object
      required: [fresh, drifting, stale, abandoned]
      properties:
        fresh: { type: integer, format: int64 }
        drifting: { type: integer, format: int64 }
        stale: { type: integer, format: int64 }
        abandoned: { type: integer, format: int64 }
    OutlineRow:
      description: "One row of the lineage outline: a base, a repo group or an image"
      type: object
      required: [id, kind, name, images, verdicts, has_children, depth]
      properties:
        id:
          type: string
          description: Row id; pass it as parent to expand the row
        parent:
          type: string
        kind:
          type: string
          enum: [base, external, phantom, unrooted, repo, image]
        name:
          type: string
        repo:
          type: string
        team:
          type: string
        digest:
          type: string
        tags:
          type: array
          items: { type: string }
        verdict:
          $ref: "#/components/schemas/Verdict"
        images:
          type: integer
          format: int64
          description: Images in this row's subtree, itself included
        verdicts:
          $ref: "#/components/schemas/VerdictCounts"
        drift:
          type: integer
          description: Generations the row's base is behind its tag; for repo rows, the most among its images
        newest:
          type: string
          format: date-time
          description: Creation time of the newest image in the subtree
        has_children:
          type: boolean
        depth:
          type: integer
    Outline:
      description: "Children of an outline row"
      type: object
      required: [rows, total, offset]
      properties:
        parent:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OutlineRow"
        total:
          type: integer
          format: int64
          description: Rows at this level before paging
        offset:
          type: integer
    FacetValue:
      description: "One value of a facet and how many images have it"
      type: object
      required: [value, count, selected]
      properties:
        value: { type: string }
        count: { type: integer, format: int64 }
        selected: { type: boolean }
    Facet:
      description: "A field the search can be narrowed by"
      type: object
      required: [name, field, values]
      properties:
        name: { type: string }
        field:
          type: string
          description: The query-language field the facet filters
        values:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
    SearchHit:
      description: "One image in search results"
      type: object
      required: [digest, repo, name, tags, platform, verdict, size]
      properties:
        digest: { type: string }
        repo: { type: string }
        name: { type: string }
        tags:
          type: array
          items: { type: string }
        team: { type: string }
        root: { type: string }
        platform: { type: string }
        verdict:
          $ref: "#/components/schemas/Verdict"
        age_days: { type: integer }
        size: { type: integer, format: int64 }
    SearchResult:
      description: "A page of search hits with facet counts"
      type: object
      required: [total, offset, hits, facets, filter]
      properties:
        total: { type: integer, format: int64 }
        offset: { type: integer }
        filter:
          type: string
          description: The filter with every facet selection folded in, as strata query takes it
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        facets:
          type: array
          items:
            $ref: "#/components/schemas/Facet"
    RootStat:
      description: "A root base and the stale images built on it"
      type: object
      required: [id, name, kind, images, verdicts]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        images: { type: integer, format: int64 }
        verdicts:
          $ref: "#/components/schemas/VerdictCounts"
    Overview:
      description: "Headline numbers for the web UI"
      type: object
      required: [images, repos, tags, stacks, apparent_bytes, dedup_bytes, verdicts, roots, changes]
      properties:
        host:
          type: string
          description: The registry host every image shares, if there is one
        images: { type: integer, format: int64 }
        repos: { type: integer, format: int64 }
        tags: { type: integer, format: int64 }
        stacks: { type: integer, format: int64 }
        apparent_bytes: { type: integer, format: int64 }
        dedup_bytes: { type: integer, format: int64 }
        verdicts:
          $ref: "#/components/schemas/VerdictCounts"
        roots:
          type: array
          items:
            $ref: "#/components/schemas/RootStat"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        indexed_at:
          type: string
          format: date-time
    CrawlStats:
      description: "Running totals of a crawl"
      type: object
      required: [repos_total, repos, repos_resumed, tags, new_images, tag_moves, requests, referrers, repos_filtered, tags_filtered, images_filtered]
      properties:
        repos_total: { type: integer, format: int64, description: "Repos this crawl visits, once listed" }
        repos: { type: integer, format: int64, description: "Repos crawled so far" }
        repos_resumed: { type: integer, format: int64, description: "Repos an earlier run already finished" }
        tags: { type: integer, format: int64 }
        new_images: { type: integer, format: int64 }
        tag_moves: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
        referrers: { type: integer, format: int64 }
        bases_fetched: { type: integer, format: int64, description: "Bases fetched by digest because provenance named them" }
        bases_missing: { type: integer, format: int64, description: "Bases provenance named that could not be fetched" }
        provenance_backfilled: { type: integer, format: int64, description: "Already indexed images whose provenance this crawl read" }
        repos_filtered: { type: integer, format: int64 }
        tags_filtered: { type: integer, format: int64 }
        images_filtered: { type: integer, format: int64 }
    Cleanup:
      description: "Deletion candidates and what deleting them frees"
      type: object
      required: [where, scope, candidates, repos, repo_count, total, images, size, reclaimable_bytes, held]
      properties:
        where: { type: string }
        scope: { type: string, enum: [registry, repo] }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CleanupCandidate"
        repos:
          type: array
          description: "Repos with candidates, most reclaimable first, capped by limit"
          items:
            $ref: "#/components/schemas/CleanupRepo"
        repo_count: { type: integer, description: "Every repo with candidates" }
        total: { type: integer, description: "Candidates: manifests or whole indexes" }
        images: { type: integer, description: "Platform images in the candidates" }
        size: { type: integer, format: int64, description: "Sizes the manifests state, a shared layer counted per image" }
        reclaimable_bytes: { type: integer, format: int64, description: "Layers freed, each once, none a kept image uses" }
        held: { type: integer, description: "Matching images kept because kept images are built on them or share their index" }
    CleanupCandidate:
      description: "A manifest or index that can be deleted"
      type: object
      required: [digest, repo, images, size, exclusive_bytes, verdict, reason, pushed_days, last_pulled_days]
      properties:
        digest: { type: string }
        repo: { type: string }
        images: { type: integer }
        size: { type: integer, format: int64 }
        exclusive_bytes: { type: integer, format: int64, description: "Freed by deleting this candidate alone" }
        verdict: { type: string }
        reason: { type: string }
        pushed_days: { type: integer, nullable: true }
        last_pulled_days: { type: integer, nullable: true }
    CleanupRepo:
      description: "Candidates of one repo"
      type: object
      required: [repo, candidates, size, reclaimable_bytes]
      properties:
        repo: { type: string }
        candidates: { type: integer }
        size: { type: integer, format: int64 }
        reclaimable_bytes: { type: integer, format: int64 }
    Lifecycle:
      description: "A generated ECR lifecycle policy for one repo, checked against the index"
      type: object
      required: [repo, name, days, expires, agree, conflicts, policy]
      properties:
        repo: { type: string }
        name: { type: string, description: "The repository name ECR uses, without the host" }
        days: { type: integer }
        expires: { type: integer, description: "Images the rule would expire today" }
        agree: { type: integer, description: "Of those, images strata lists for cleanup" }
        conflicts:
          type: array
          items:
            type: object
            required: [digest, reason]
            properties:
              digest: { type: string }
              reason: { type: string }
        policy:
          nullable: true
          description: "The lifecycle policy document, or null when the repo is skipped"
          type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                type: object
                required: [rulePriority, description, selection, action]
                properties:
                  rulePriority: { type: integer }
                  description: { type: string }
                  selection:
                    type: object
                    required: [tagStatus, countType, countNumber]
                    properties:
                      tagStatus: { type: string }
                      countType: { type: string }
                      countUnit: { type: string }
                      countNumber: { type: integer }
                  action:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string }
        skipped: { type: string, description: "Why the repo has no policy" }
    RefreshStats:
      description: "What the last refresh rewrote; refreshes are incremental"
      type: object
      required: [full, lineage_skipped, lineage_changed, verdicts_changed, facts_rebuilt, snapshot_rows, snapshot_skipped, duration]
      properties:
        full: { type: boolean, description: "Every derived table was rebuilt" }
        lineage_skipped: { type: boolean, description: "No input to lineage changed" }
        lineage_changed: { type: integer, description: "Lineage rows rewritten" }
        verdicts_changed: { type: integer, description: "Staleness rows rewritten" }
        facts_rebuilt: { type: integer, description: "Image rows rebuilt in the query table; -1 when rebuilt in full" }
        snapshot_rows: { type: integer, description: "Snapshot rows added, changed or removed" }
        snapshot_skipped: { type: boolean, description: "No image row changed since today's snapshot" }
        duration: { type: integer, format: int64, description: "Nanoseconds the refresh took" }
    IndexStatus:
      description: "State of the running or last index"
      type: object
      required: [running, refreshing, refresh_every_seconds, crawl]
      properties:
        running: { type: boolean }
        registry: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        refreshed_at:
          type: string
          format: date-time
          description: When lineage, staleness and the views were last recomputed; unset until the first refresh finishes
        refreshing:
          type: boolean
          description: A refresh is running now
        refresh_every_seconds:
          type: integer
          format: int64
          description: How often views refresh during a crawl; 0 means only at the end
        crawl:
          $ref: "#/components/schemas/CrawlStats"
        error: { type: string, description: "Why the last index failed" }
        refresh_error: { type: string, description: "Why the last refresh failed; cleared when one succeeds" }
        last_refresh:
          $ref: "#/components/schemas/RefreshStats"
    Change:
      description: "One line of a diff between snapshots"
      type: object
      required: [kind, group, from, to]
      properties:
        kind: { type: string }
        group: { type: string }
        metric: { type: string }
        from: { type: number }
        to: { type: number }
    KPIDay:
      description: "One day of whole-index numbers"
      type: object
      required: [day, images, repos, unique_stacks, dedup_bytes, stale, abandoned]
      properties:
        day: { type: string, format: date }
        images: { type: integer, format: int64 }
        repos: { type: integer, format: int64 }
        unique_stacks: { type: integer, format: int64 }
        dedup_bytes: { type: integer, format: int64 }
        stale: { type: integer, format: int64 }
        abandoned: { type: integer, format: int64 }
    StorageSeries:
      description: "One group's stored bytes per day"
      type: object
      required: [group, values]
      properties:
        group: { type: string }
        label: { type: string, description: "Name of a root base that is not indexed" }
        other: { type: boolean, description: "Folds every group outside the top" }
        values:
          type: array
          items: { type: integer, format: int64 }
    Storage:
      description: "Stored bytes over time, split by root base or repo"
      type: object
      required: [group_by, days, series]
      properties:
        group_by: { type: string }
        days:
          type: array
          items: { type: string, format: date }
        series:
          type: array
          items: { $ref: "#/components/schemas/StorageSeries" }
    DayCount:
      type: object
      required: [day, count]
      properties:
        day: { type: string, format: date }
        count: { type: integer, format: int64 }
    RepoCount:
      type: object
      required: [repo, count]
      properties:
        repo: { type: string }
        count: { type: integer, format: int64 }
    Activity:
      description: "Images pushed per day"
      type: object
      required: [source, from, to, days, repos]
      properties:
        source: { type: string, enum: [pushed, created], description: "pushed when the registry reports push times, else created" }
        repo: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/DayCount" }
        repos:
          type: array
          description: The busiest repos in the window
          items: { $ref: "#/components/schemas/RepoCount" }
        last_push: { type: string, format: date, description: "The repo's newest push, in the window or not" }
    AgeBin:
      type: object
      required: [label, verdicts, unrated, filter]
      properties:
        label: { type: string }
        verdicts: { $ref: "#/components/schemas/VerdictCounts" }
        unrated: { type: integer, format: int64, description: "Images with no verdict yet" }
        filter: { type: string, description: "The query that selects this bucket's images" }
    Ages:
      description: "Images by age and verdict"
      type: object
      required: [source, bins]
      properties:
        source: { type: string, enum: [pushed, created] }
        bins:
          type: array
          items: { $ref: "#/components/schemas/AgeBin" }
    Coverage:
      description: "How one registry's images were linked to their bases"
      type: object
      required: [registry, images, layers, provenance, declared, named, unknown, roots]
      properties:
        registry: { type: string }
        images: { type: integer, format: int64 }
        layers: { type: integer, format: int64, description: "Parent found by shared layers" }
        provenance: { type: integer, format: int64, description: "Parent found by build provenance" }
        declared: { type: integer, format: int64, description: "Parent declared by an annotation or label" }
        named: { type: integer, format: int64, description: "Base named by provenance but not indexed" }
        unknown: { type: integer, format: int64, description: "Base neither indexed nor named" }
        roots: { type: integer, format: int64, description: "No parent: bases, FROM scratch and single-layer images" }
    BaseRepo:
      type: object
      required: [repo, images]
      properties:
        repo: { type: string }
        images: { type: integer, format: int64, description: "Images in other repos built directly on it" }
    Release:
      description: "One build of a base: an index or a single-platform image"
      type: object
      required: [digest, tags, behind, images, repos, verdicts]
      properties:
        digest: { type: string }
        tags:
          type: array
          items: { type: string }
        built: { type: string, format: date }
        behind: { type: integer, description: "Newer releases of the base" }
        images: { type: integer, format: int64 }
        repos: { type: integer, format: int64 }
        verdicts: { $ref: "#/components/schemas/VerdictCounts" }
    Adoption:
      description: "Which releases of a base images are built on"
      type: object
      required: [base, bases, releases]
      properties:
        base: { type: string }
        bases:
          type: array
          items: { $ref: "#/components/schemas/BaseRepo" }
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    RolloutSeries:
      type: object
      required: [release, tags, counts]
      properties:
        release: { type: string }
        tags:
          type: array
          items: { type: string }
        built: { type: string, format: date }
        older: { type: boolean, description: "Folds older and deleted releases" }
        counts:
          type: array
          items: { type: integer, format: int64 }
    Rollout:
      description: "How images moved between a base's releases over time"
      type: object
      required: [base, days, series]
      properties:
        base: { type: string }
        days:
          type: array
          items: { type: string, format: date }
        series:
          type: array
          items: { $ref: "#/components/schemas/RolloutSeries" }
