site_name: strata
site_description: Every image's lineage and staleness, from registry metadata alone.
site_url: https://rossedman.io/strata/
repo_url: https://github.com/rossedman/strata
repo_name: rossedman/strata
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/favicon.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/landing.js
  - assets/site/docs.js

plugins:
  - search
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

exclude_docs: |
  /assets/src/
  /assets/render.sh

nav:
  - Home: index.md
  - Get started:
      - Install and first run: getting-started.md
      - Configuration: configuration.md
  - Guides:
      - Scaling to large registries: guides/scaling.md
      - Lineage: guides/lineage.md
      - Staleness: guides/staleness.md
      - Query language: guides/query-language.md
      - Exploring the footprint: guides/footprint.md
      - Vulnerabilities: guides/vulnerabilities.md
      - Cleanup: guides/cleanup.md
      - Graphs: guides/graphs.md
      - Serving, API and MCP: guides/serving.md
  - Reference:
      - Commands:
          - strata: reference/commands/strata.md
          - strata ancestry: reference/commands/strata_ancestry.md
          - strata bases: reference/commands/strata_bases.md
          - strata bases similar: reference/commands/strata_bases_similar.md
          - strata cleanup: reference/commands/strata_cleanup.md
          - strata cleanup lifecycle: reference/commands/strata_cleanup_lifecycle.md
          - strata descendants: reference/commands/strata_descendants.md
          - strata diff: reference/commands/strata_diff.md
          - strata explain: reference/commands/strata_explain.md
          - strata history: reference/commands/strata_history.md
          - strata history export: reference/commands/strata_history_export.md
          - strata history import: reference/commands/strata_history_import.md
          - strata index: reference/commands/strata_index.md
          - strata labels: reference/commands/strata_labels.md
          - strata layers: reference/commands/strata_layers.md
          - strata layers bloat: reference/commands/strata_layers_bloat.md
          - strata layers top: reference/commands/strata_layers_top.md
          - strata map: reference/commands/strata_map.md
          - strata mcp: reference/commands/strata_mcp.md
          - strata query: reference/commands/strata_query.md
          - strata refresh: reference/commands/strata_refresh.md
          - strata roots: reference/commands/strata_roots.md
          - strata serve: reference/commands/strata_serve.md
          - strata stale: reference/commands/strata_stale.md
          - strata summary: reference/commands/strata_summary.md
          - strata trend: reference/commands/strata_trend.md
          - strata ui: reference/commands/strata_ui.md
          - strata version: reference/commands/strata_version.md
          - strata vulns: reference/commands/strata_vulns.md
          - strata vulns bases: reference/commands/strata_vulns_bases.md
          - strata vulns impact: reference/commands/strata_vulns_impact.md
      - HTTP API: reference/api.md
  - Project:
      - Roadmap: roadmap.md
      - Release notes: https://github.com/rossedman/strata/releases
      - Contributing: contributing.md
      - Security: security.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/strata
