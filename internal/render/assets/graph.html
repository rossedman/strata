<style>

  --brand: #a99bff; --brand-2: #d6cfff; --brand-3: #5b47d6;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--mist); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 20px; padding: 12px 20px; background: var(--ink-2); border-bottom: 1px solid var(--ink-3); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { color: var(--brand); font-weight: 800; letter-spacing: -0.02em; font-size: 16px; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46ch; }
.host { font: 12px var(--mono); color: var(--dim); }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--ink-3); border-radius: 999px; background: var(--ink-4); color: var(--mist); font-size: 12px; cursor: pointer; user-select: none; transition: opacity .15s, border-color .15s; }

.mono { font-family: var(--mono); font-size: 12px; }
.intro p { margin: 10px 0 0; font-size: 13px; color: var(--mist); }
.legend { display: grid; gap: 10px; font-size: 12.5px; color: var(--mist); }

.legend .sw::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--fresh); }
.legend .sw.ext { border-radius: 8px; border-style: solid; border-color: var(--brand); }

.legend .sw.ph::before { display: none; }

@media (max-width: 860px) {
  header { gap: 12px; padding: 10px 16px; }
  .tools { margin-left: 0; width: 100%; }
  input[type=search] { flex: 1; width: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--ink-3); }

<body>
<div class="app">
<header>
  <div class="brand"><b>strata</b><h1 id="title"></h1><span class="host" id="host"></span></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input type="search" id="search" placeholder="Search names, refs, labels" aria-label="Search nodes">
    <button id="fit" type="button" title="Fit the graph to the window">Fit</button>
  </div>
</header>
<main>
  <div id="cy" role="img" aria-label="Lineage graph"></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
</div>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>/*__VENDOR__*/</script>
<script>
(function () {
  "use strict";
  var view = JSON.parse(document.getElementById("data").textContent);
  var data = view.graph, display = view.display || {};
  var colors = { fresh: "#5fd39a", drifting: "#e8c84a", stale: "#f08a5d", abandoned: "#a3a3ad", "": "#6b6880" };
  var verdicts = ["fresh", "drifting", "stale", "abandoned"];
  var up = data.kind === "ancestry";
  var dir = data.kind === "descendants" ? "RIGHT" : "DOWN";
  if (typeof cytoscapeElk !== "undefined") { cytoscape.use(cytoscapeElk); }
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var bytes = function (n) { if (!n) { return ""; } var u = ["B", "KiB", "MiB", "GiB", "TiB"], i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + " " + u[i]; };

  // Each node is drawn as an SVG card: a verdict bar, the name and the
  // digest line, sized to its text.
  var measure = document.createElement("canvas").getContext("2d");
  function width(text, font) { measure.font = font; return measure.measureText(text).width; }
  var TITLE = "600 13px Inter, ui-sans-serif, system-ui, sans-serif";
  var SUB = "11px 'JetBrains Mono', ui-monospace, Menlo, monospace";
  function card(n, d) {
    var title = d.title || n.label, sub = d.sub || "";
    var maxTitle = 300;
    while (width(title, TITLE) > maxTitle && title.length > 8) { title = "…" + title.slice(2); }
    var w = Math.ceil(Math.max(width(title, TITLE), width(sub, SUB)) + 34);
    var h = 50;
    var bar = n.kind === "phantom" ? "none" : (colors[n.verdict || ""] || colors[""]);
    var fill = n.kind === "phantom" ? "#0e0d16" : "#17152a";
    var stroke = n.kind === "external" ? "#a99bff" : n.kind === "phantom" ? "#6b6880" : "#3a3458";
    var dash = n.kind === "phantom" ? ' stroke-dasharray="4 3"' : "";
    var rx = n.kind === "external" ? 18 : 8;
    var stack = n.kind === "collapsed" ? '<rect x="5" y="5" width="' + (w - 6) + '" height="' + (h - 6) + '" rx="' + rx + '" fill="#17152a" stroke="#3a3458"/>' : "";
    var bw = n.kind === "collapsed" ? w - 6 : w - 1, bh = n.kind === "collapsed" ? h - 6 : h - 1;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' + stack +
      '<rect x="0.5" y="0.5" width="' + bw + '" height="' + bh + '" rx="' + rx + '" fill="' + fill + '" stroke="' + stroke + '"' + dash + "/>" +
      (bar === "none" ? "" : '<rect x="0.5" y="0.5" width="4" height="' + bh + '" rx="2" fill="' + bar + '"/>') +
      '<text x="16" y="21" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="' + (n.kind === "phantom" ? "#c9c4dd" : "#f4f1ff") + '">' + esc(title) + "</text>" +
      '<text x="16" y="38" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#8e8aa6">' + esc(sub) + "</text></svg>";
    return { url: "data:image/svg+xml;utf8," + encodeURIComponent(svg), w: w, h: h };
  }

  var host = view.host;
  document.getElementById("title").textContent = data.kind === "query" ? data.title || "query" : data.kind;
  document.getElementById("host").textContent = host ? "· " + host : "";
  document.title = "strata · " + (data.title || data.kind);

  var elements = [];
  var count = { fresh: 0, drifting: 0, stale: 0, abandoned: 0 };
  var images = 0;
  data.nodes.forEach(function (n) {
    var c = card(n, display[n.id] || {});
    var weight = n.count || (n.kind === "phantom" ? 0 : 1);
    images += weight;
    if (count[n.verdict] !== undefined) { count[n.verdict] += weight; }
    elements.push({ data: { id: n.id, node: n, img: c.url, w: c.w, h: c.h, matched: !!n.matched, kind: n.kind } });
  });
  data.edges.forEach(function (e, i) {
    var label = e.conflict ? "conflict: " + e.source : (e.source === "layers" || !e.source ? "" : e.source);
    elements.push({ data: { id: "e" + i, source: up ? e.child : e.parent, target: up ? e.parent : e.child, label: label, declared: e.source === "label" || e.source === "annotation", conflict: !!e.conflict } });
  });

  var on = { fresh: true, drifting: true, stale: true, abandoned: true };
  var stats = document.getElementById("stats");
  stats.innerHTML = '<span class="stat total"><b>' + images + "</b> images</span>";
  verdicts.forEach(function (v) {
    if (!count[v]) { return; }
    var s = document.createElement("span");
    s.className = "stat";
    s.setAttribute("role", "button");
    s.setAttribute("tabindex", "0");
    s.title = "Show or hide " + v + " images";
    s.innerHTML = '<i style="background:' + colors[v] + '"></i>' + v + " <b>" + count[v] + "</b>";
    var toggle = function () { on[v] = !on[v]; s.classList.toggle("off", !on[v]); apply(); };
    s.addEventListener("click", toggle);
    s.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); } });
    stats.appendChild(s);
  });

  var cy = cytoscape({
    container: document.getElementById("cy"),
    elements: elements,
    wheelSensitivity: 0.25,
    minZoom: 0.05, maxZoom: 3,
    style: [
      { selector: "node", style: {
        "shape": "round-rectangle", "width": "data(w)", "height": "data(h)",
        "background-opacity": 0, "border-width": 0,
        "background-image": "data(img)", "background-fit": "none", "background-clip": "none", "background-image-containment": "over",
        "underlay-color": "#a99bff", "underlay-padding": 5, "underlay-shape": "round-rectangle",
        "underlay-opacity": function (n) { return n.data("matched") ? 0.28 : 0; }
      } },
      { selector: "node:selected", style: { "underlay-opacity": 0.45, "underlay-color": "#d6cfff" } },
      { selector: "edge", style: {
        "width": function (e) { return e.data("conflict") ? 2 : 1.5; },
        "line-color": function (e) { return e.data("conflict") ? "#ff6b81" : "#4a4468"; },
        "target-arrow-color": function (e) { return e.data("conflict") ? "#ff6b81" : "#4a4468"; },
        "target-arrow-shape": "triangle", "arrow-scale": 0.8,
        "curve-style": "taxi", "taxi-direction": dir === "RIGHT" ? "horizontal" : "vertical", "taxi-turn": "50%",
        "line-style": function (e) { return e.data("declared") ? "dashed" : "solid"; },
        "label": "data(label)", "font-size": 10, "color": function (e) { return e.data("conflict") ? "#ff6b81" : "#8e8aa6"; },
        "text-background-color": "#0e0d16", "text-background-opacity": 1, "text-background-padding": "3px", "text-background-shape": "round-rectangle"
      } },
      { selector: ".hidden", style: { "display": "none" } },
      { selector: ".dim", style: { "opacity": 0.15 } }
    ],
    layout: typeof cytoscapeElk !== "undefined"
      ? { name: "elk", fit: true, padding: 40, elk: { algorithm: "layered", "elk.direction": dir, "elk.edgeRouting": "ORTHOGONAL",
          "elk.spacing.nodeNode": 18, "elk.layered.spacing.nodeNodeBetweenLayers": 56, "elk.layered.nodePlacement.strategy": "BRANDES_KOEPF" } }
      : { name: "breadthfirst", directed: true, padding: 40 }
  });

  var panel = document.getElementById("panel");
  function row(k, v) { return v === undefined || v === null || v === "" ? "" : "<dt>" + esc(k) + "</dt><dd>" + v + "</dd>"; }
  function list(items, cls, mono) { return '<ul class="plain ' + (cls || "") + '">' + items.map(function (r) { return "<li" + (mono ? ' class="mono"' : "") + ">" + esc(r) + "</li>"; }).join("") + "</ul>"; }
  function legend() {
    return '<section><h3>Legend</h3><div class="legend">' +
      '<div><span class="sw"></span> image, bar colored by verdict</div>' +
      '<div><span class="sw ext"></span> external base</div>' +
      '<div><span class="sw ph"></span> shared layers no indexed image ends at</div>' +
      '<div><span class="sw col"></span> sibling images in one repo, collapsed</div>' +
      '<div><span class="ln"></span> parent found from layers</div>' +
      '<div><span class="ln dash"></span> parent declared by a label or annotation</div>' +
      '<div><span class="ln red"></span> declared parent disagrees with layers</div>' +
      "</div></section>";
  }
  function intro() {
    var what = { ancestry: "The chain from an image down to its root base.", descendants: "Everything built on a base, found by layer prefix whatever it is named.", query: "Images matching the filter, highlighted, with their ancestry up to shared roots.", map: "Every root base and its descendants." }[data.kind] || "";
    panel.innerHTML = '<div class="intro"><h2>' + esc(data.kind === "query" ? data.title : data.kind) + "</h2><p>" + esc(what) + "</p>" +
      (data.hidden ? "<p>" + data.hidden + " images are over the node budget and hidden; raise it with --budget.</p>" : "") +
      "<p>Click a node for its refs, labels and staleness reasons.</p></div>" + legend();
  }
  function show(n) {
    var d = display[n.id] || {};
    var h = "<h2>" + esc(d.title || n.label) + '</h2><div class="digest">' + esc(n.id.replace(/^phantom:/, "")) + "</div>";
    if (n.verdict) { h += '<span class="badge"><i style="background:' + colors[n.verdict] + '"></i>' + esc(n.verdict) + (n.note ? ' <span style="color:var(--dim);font-weight:500">· ' + esc(n.note) + "</span>" : "") + "</span>"; }
    if (n.reasons && n.reasons.length) {
      h += '<section><h3>Why</h3><ul class="plain reasons" style="--rc:' + (colors[n.verdict] || "#8e8aa6") + '">' + n.reasons.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></section>";
    }
    var kind = { image: "image", external: "external base", phantom: "not in the registry: layers that several images share, whose own image was deleted or never pushed", collapsed: "collapsed siblings", overflow: "hidden by the node budget" }[n.kind];
    h += "<section><h3>Details</h3><dl>" + row("kind", esc(kind)) + row("repo", esc(n.repo || "")) + row("platform", esc(n.platform || "")) +
      row("created", esc(n.created || "")) + row("size", esc(bytes(n.size))) + row("layers", n.layers ? esc(n.layers) : "") +
      row("generation", n.kind === "overflow" ? "" : esc(n.depth)) + "</dl></section>";
    if (n.refs && n.refs.length) { h += "<section><h3>Tags</h3>" + list(n.refs, "", true) + "</section>"; }
    if (n.members && n.members.length) { h += "<section><h3>" + n.members.length + " images</h3>" + list(n.members, "", true) + "</section>"; }
    panel.innerHTML = h;
  }
  cy.on("tap", "node", function (ev) { show(ev.target.data("node")); });
  cy.on("tap", function (ev) { if (ev.target === cy) { intro(); } });

  var search = document.getElementById("search");
  function apply() {
    var q = search.value.trim().toLowerCase();
    cy.batch(function () {
      cy.nodes().forEach(function (node) {
        var n = node.data("node"), d = display[n.id] || {};
        node.toggleClass("hidden", !!n.verdict && !on[n.verdict]);
        var text = [d.title, d.sub, n.label, n.repo, (n.refs || []).join(" "), (n.members || []).join(" ")].join(" ").toLowerCase();
        node.toggleClass("dim", q !== "" && text.indexOf(q) < 0);
      });
    });
  }
  search.addEventListener("input", apply);
  document.getElementById("fit").addEventListener("click", function () { cy.animate({ fit: { padding: 40 } }, { duration: 250 }); });
  intro();
})();
</script>
