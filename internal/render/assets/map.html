<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="strata">
<title>__TITLE__</title>
<style>
:root { --ink: #0e0d16; --ink-2: #17152a; --ink-3: #2a2540; --ink-4: #0a0912; --line: #3a3458; --brand: #a99bff; --cream: #f4f1ff; --mist: #c9c4dd; --dim: #8e8aa6;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--mist); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
header { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 12px 20px; background: var(--ink-2); border-bottom: 1px solid var(--ink-3); }
.brand { display: flex; gap: 10px; align-items: baseline; }
.brand b { color: var(--brand); font-weight: 800; letter-spacing: -0.02em; font-size: 16px; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--cream); }
.host { font: 12px var(--mono); color: var(--dim); }
.stat { display: inline-flex; gap: 6px; align-items: center; height: 28px; padding: 0 10px; border: 1px solid var(--ink-3); border-radius: 999px; background: var(--ink-4); font-size: 12px; }
.stat b { color: var(--cream); font-variant-numeric: tabular-nums; }
.crumbs { font-size: 13px; color: var(--dim); }
.crumbs a { color: var(--brand); cursor: pointer; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.scale { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.scale i { width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #5fd39a, #e8c84a, #f08a5d); }
.cols { display: grid; padding: 14px 20px 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#map { padding: 8px 20px 28px; }
svg { width: 100%; display: block; }
.blk { cursor: pointer; }
.blk rect.bg { fill: var(--ink-2); stroke: var(--ink); stroke-width: 2; }
.blk:hover rect.bg { fill: #201d3a; }
.blk text { pointer-events: none; }
#tip { position: fixed; pointer-events: none; background: var(--ink-2); border: 1px solid var(--line); color: var(--mist); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; display: none; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#tip b { color: var(--cream); display: block; margin-bottom: 2px; font-size: 13px; }
#tip .bar { height: 6px; border-radius: 3px; margin-top: 8px; background: var(--ink-3); overflow: hidden; }
#tip .bar i { display: block; height: 100%; }
@media (max-width: 760px) { .scale { margin-left: 0; } header { gap: 10px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>strata</b><h1>registry map</h1><span class="host" id="host"></span></div>
  <span class="stat" id="roots"></span><span class="stat" id="images"></span>
  <div class="crumbs" id="crumbs"></div>
  <div class="scale" aria-label="Block color is the share of stale or abandoned images">fresh <i></i> stale</div>
</header>
<div class="cols" id="cols"></div>
<div id="map"></div>
<div id="tip" role="tooltip"></div>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var view = JSON.parse(document.getElementById("data").textContent);
  var data = view.graph, display = view.display || {};
  var byId = {}, kids = {}, hasParent = {};
  data.nodes.forEach(function (n) { byId[n.id] = n; kids[n.id] = []; });
  data.edges.forEach(function (e) { if (kids[e.parent] && byId[e.child]) { kids[e.parent].push(e.child); hasParent[e.child] = true; } });
  var roots = data.nodes.filter(function (n) { return !hasParent[n.id]; }).map(function (n) { return n.id; });
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var title = function (id) { var d = display[id]; return d ? d.title : byId[id].label; };
  var stats = {};
  function walk(id, seen) {
    if (stats[id]) { return stats[id]; }
    if (seen[id]) { return { images: 0, stale: 0, depth: 0 }; }
    seen[id] = true;
    var n = byId[id], s = { images: n.kind === "phantom" ? 0 : 1, stale: n.verdict === "stale" || n.verdict === "abandoned" ? 1 : 0, depth: 1 };
    kids[id].forEach(function (k) { var c = walk(k, seen); s.images += c.images; s.stale += c.stale; s.depth = Math.max(s.depth, c.depth + 1); });
    s.images = Math.max(s.images, 1);
    stats[id] = s;
    return s;
  }
  roots.forEach(function (r) { walk(r, {}); });
  roots.sort(function (a, b) { return stats[b].images - stats[a].images; });
  var total = roots.reduce(function (n, r) { return n + stats[r].images; }, 0);
  document.getElementById("host").textContent = view.host ? "· " + view.host : "";
  document.getElementById("roots").innerHTML = "<b>" + roots.length + "</b> root bases";
  document.getElementById("images").innerHTML = "<b>" + total + "</b> images";

  function mix(a, b, t) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return "rgb(" + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * t); }).join(",") + ")";
  }
  function shade(share) { return share < 0.5 ? mix("#5fd39a", "#e8c84a", share * 2) : mix("#e8c84a", "#f08a5d", (share - 0.5) * 2); }

  var tip = document.getElementById("tip");
  var focus = null;
  var PAD = 2, BAR = 4;
  function draw() {
    var top = focus ? [focus] : roots;
    var sum = top.reduce(function (n, r) { return n + stats[r].images; }, 0);
    var depth = top.reduce(function (d, r) { return Math.max(d, stats[r].depth); }, 1);
    var width = Math.max(320, document.getElementById("map").clientWidth - 40);
    var rowH = width < 600 ? 30 : 26;
    var height = Math.max(360, Math.min(6000, sum * rowH));
    var col = width / depth;
    var out = [];
    function place(id, x, y, h) {
      var n = byId[id], s = stats[id];
      var share = s.stale / Math.max(1, s.images);
      var color = n.kind === "phantom" ? "#3a3458" : shade(share);
      var w = col - PAD, hh = Math.max(h - PAD, 1);
      out.push('<g class="blk" data-id="' + esc(id) + '"><rect class="bg" data-id="' + esc(id) + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="4"/>' +
        '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + BAR + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + color + '"/>' );
      if (hh >= 20 && w > 70) {
        var label = title(id), max = Math.floor((w - 70) / 6.6);
        if (label.length > max) { label = "…" + label.slice(label.length - Math.max(3, max - 1)); }
        out.push('<text x="' + (x + 12).toFixed(1) + '" y="' + (y + Math.min(hh / 2 + 4, 17)).toFixed(1) + '" font-size="12" font-weight="600" fill="' + (n.kind === "phantom" ? "#8e8aa6" : "#f4f1ff") + '">' + esc(label) + "</text>" +
          '<text x="' + (x + w - 8).toFixed(1) + '" y="' + (y + Math.min(hh / 2 + 4, 17)).toFixed(1) + '" font-size="11" text-anchor="end" fill="#8e8aa6" font-family="JetBrains Mono, ui-monospace, monospace">' + s.images + "</text>");
      }
      out.push("</g>");
      var cy = y;
      kids[id].slice().sort(function (a, b) { return stats[b].images - stats[a].images; }).forEach(function (k) {
        var kh = h * stats[k].images / s.images;
        place(k, x + col, cy, kh);
        cy += kh;
      });
    }
    var y = 0;
    top.forEach(function (r) { var h = height * stats[r].images / sum; place(r, 0, y, h); y += h; });
    document.getElementById("map").innerHTML = '<svg viewBox="0 0 ' + width + " " + height + '" height="' + height + '" role="img" aria-label="Icicle chart of root bases and their descendants">' + out.join("") + "</svg>";
    var cols = document.getElementById("cols");
    cols.style.gridTemplateColumns = "repeat(" + depth + ", 1fr)";
    cols.innerHTML = Array.from({ length: depth }, function (_, i) { return "<span>" + (i === 0 ? (focus ? "base" : "root bases") : "generation " + i) + "</span>"; }).join("");
    var crumbs = document.getElementById("crumbs");
    crumbs.innerHTML = focus ? '<a id="all">All roots</a> / ' + esc(title(focus)) : "Click a block to zoom in";
    if (focus) { document.getElementById("all").onclick = function () { focus = null; draw(); }; }
  }
  var map = document.getElementById("map");
  map.addEventListener("click", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-id");
    if (id && kids[id].length) { focus = focus === id ? null : id; draw(); }
  });
  map.addEventListener("mousemove", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-id");
    if (!id) { tip.style.display = "none"; return; }
    var n = byId[id], s = stats[id], pct = Math.round(100 * s.stale / s.images);
    var kind = n.kind === "external" ? "external base · " : n.kind === "phantom" ? "not in the registry · " : "";
    tip.innerHTML = "<b>" + esc(title(id)) + "</b>" + kind + s.images + " image" + (s.images === 1 ? "" : "s") + " · " + pct + "% stale or abandoned" +
      (n.verdict ? "<br>this image: " + esc(n.verdict) + (n.note ? " (" + esc(n.note) + ")" : "") : "") +
      '<div class="bar"><i style="width:' + pct + "%;background:" + shade(s.stale / s.images) + '"></i></div>';
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 400) + "px";
    tip.style.top = (ev.clientY + 16) + "px";
  });
  map.addEventListener("mouseleave", function () { tip.style.display = "none"; });
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
