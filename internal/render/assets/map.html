<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="strata">
<title>__TITLE__</title>
<style>
:root { --ink: #0e0d16; --ink-2: #17152a; --ink-3: #2a2540; --brand: #a99bff; --cream: #f4f1ff; --mist: #c9c4dd; --dim: #8e8aa6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--mist); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; padding: 14px 16px; background: var(--ink-2); border-bottom: 1px solid var(--ink-3); }
h1 { margin: 0; font-size: 15px; color: var(--cream); }
h1 span { color: var(--brand); }
.meta, .crumbs { color: var(--dim); font-size: 12px; }
.crumbs a { color: var(--brand); cursor: pointer; text-decoration: none; }
.scale { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.scale i { width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, #5fd39a, #e8c84a, #f08a5d); display: inline-block; }
#map { padding: 12px 16px 24px; }
svg { width: 100%; display: block; }
rect { stroke: var(--ink); stroke-width: 1; cursor: pointer; }
text { fill: #14111f; font-size: 11px; pointer-events: none; }
#tip { position: fixed; pointer-events: none; background: var(--ink-2); border: 1px solid var(--ink-3); color: var(--mist); padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none; max-width: 360px; }
#tip b { color: var(--cream); }
</style>
</head>
<body>
<header>
  <h1><span>strata</span> · registry map</h1>
  <div class="meta" id="meta"></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="scale">fresh <i></i> stale</div>
</header>
<div id="map"></div>
<div id="tip"></div>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var byId = {}, kids = {};
  data.nodes.forEach(function (n) { byId[n.id] = n; kids[n.id] = []; });
  var hasParent = {};
  data.edges.forEach(function (e) { if (kids[e.parent] && byId[e.child]) { kids[e.parent].push(e.child); hasParent[e.child] = true; } });
  var roots = data.nodes.filter(function (n) { return !hasParent[n.id]; }).map(function (n) { return n.id; });
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var stats = {};
  function walk(id, seen) {
    if (stats[id]) { return stats[id]; }
    if (seen[id]) { return { images: 0, stale: 0, depth: 0 }; }
    seen[id] = true;
    var n = byId[id], s = { images: n.kind === "phantom" ? 0 : 1, stale: n.verdict === "stale" || n.verdict === "abandoned" ? 1 : 0, depth: 1 };
    kids[id].forEach(function (k) { var c = walk(k, seen); s.images += c.images; s.stale += c.stale; s.depth = Math.max(s.depth, c.depth + 1); });
    s.images = Math.max(s.images, 1);
    stats[id] = s;
    return s;
  }
  roots.forEach(function (r) { walk(r, {}); });
  roots.sort(function (a, b) { return stats[b].images - stats[a].images; });
  var total = roots.reduce(function (n, r) { return n + stats[r].images; }, 0);
  document.getElementById("meta").textContent = roots.length + " root bases · " + total + " images";

  function mix(a, b, t) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return "rgb(" + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * t); }).join(",") + ")";
  }
  function shade(share) { return share < 0.5 ? mix("#5fd39a", "#e8c84a", share * 2) : mix("#e8c84a", "#f08a5d", (share - 0.5) * 2); }

  var tip = document.getElementById("tip");
  var focus = null;
  function draw() {
    var top = focus ? [focus] : roots;
    var sum = top.reduce(function (n, r) { return n + stats[r].images; }, 0);
    var depth = top.reduce(function (d, r) { return Math.max(d, stats[r].depth); }, 1);
    var width = document.getElementById("map").clientWidth - 32;
    var height = Math.max(420, Math.min(4000, sum * 3));
    var col = width / depth;
    var out = [];
    function place(id, x, y, h) {
      var n = byId[id], s = stats[id];
      var share = s.stale / Math.max(1, s.images);
      out.push('<rect data-id="' + esc(id) + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (col - 2).toFixed(1) + '" height="' + Math.max(h - 1, 0.5).toFixed(1) + '" rx="3" fill="' + (n.kind === "phantom" ? "#2a2540" : shade(share)) + '"/>');
      if (h > 16 && col > 60) {
        var label = n.label.length * 6.2 > col - 12 ? n.label.slice(0, Math.max(3, Math.floor((col - 12) / 6.2) - 1)) + "…" : n.label;
        out.push('<text x="' + (x + 6).toFixed(1) + '" y="' + (y + 14).toFixed(1) + '">' + esc(label) + "</text>");
      }
      var cy = y;
      kids[id].slice().sort(function (a, b) { return stats[b].images - stats[a].images; }).forEach(function (k) {
        var kh = h * stats[k].images / s.images;
        place(k, x + col, cy, kh);
        cy += kh;
      });
    }
    var y = 0;
    top.forEach(function (r) { var h = height * stats[r].images / sum; place(r, 0, y, h); y += h; });
    document.getElementById("map").innerHTML = '<svg viewBox="0 0 ' + width + " " + height + '" height="' + height + '" role="img" aria-label="Icicle chart of root bases and their descendants">' + out.join("") + "</svg>";
    var crumbs = document.getElementById("crumbs");
    crumbs.innerHTML = focus ? '<a id="all">all roots</a> / ' + esc(byId[focus].label) : "click a block to zoom in";
    if (focus) { document.getElementById("all").onclick = function () { focus = null; draw(); }; }
  }
  document.getElementById("map").addEventListener("click", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-id");
    if (id) { focus = focus === id ? null : id; draw(); }
  });
  document.getElementById("map").addEventListener("mousemove", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-id");
    if (!id) { tip.style.display = "none"; return; }
    var n = byId[id], s = stats[id];
    tip.innerHTML = "<b>" + esc(n.label) + "</b><br>" + s.images + " images · " + Math.round(100 * s.stale / s.images) + "% stale or abandoned" + (n.kind === "external" ? "<br>external base" : n.kind === "phantom" ? "<br>not in the registry" : "");
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 380) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  document.getElementById("map").addEventListener("mouseleave", function () { tip.style.display = "none"; });
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
