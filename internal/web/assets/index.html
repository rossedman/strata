<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>strata</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Views">
    <a class="logo" href="#overview"><img src="logo.svg" alt="" width="22" height="22">strata</a>
    <a href="#overview" data-view="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>Overview</a>
    <a href="#lineage" data-view="lineage"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 2v12M3 5h5M3 10h5M8 3h6v4H8zM8 8h6v4H8z"/></svg>Lineage</a>
    <a href="#search" data-view="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search</a>
    <a href="#image" data-view="image"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z"/><path d="M2 5l6 3.5L14 5M8 8.5V14.5"/></svg>Image</a>
    <div class="foot" id="foot"></div>
  </nav>
  <div class="main">
    <form class="top" id="qform" role="search">
      <label class="query" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder='Filter with the query language, e.g. label.team = "payments" and stale.base_drift' aria-label="Query">
        <span class="kbd" aria-hidden="true">/</span>
      </label>
    </form>
    <div class="indexing" id="indexing" role="status" aria-live="polite" hidden></div>
    <section class="view" id="v-overview" hidden></section>
    <section class="view" id="v-lineage" hidden></section>
    <section class="view" id="v-search" hidden></section>
    <section class="view" id="v-image" hidden></section>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
