# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: strata

before:
  hooks:
    - go mod tidy
    - go generate ./...

# DuckDB is linked through cgo, so each target names its own C and C++
# compilers. They come from the goreleaser-cross image the release
# workflow runs in; DuckDB ships no windows/arm64 build.
builds:
  - id: linux-amd64
    goos: [linux]
    goarch: [amd64]
    env: [CGO_ENABLED=1, CC=x86_64-linux-gnu-gcc, CXX=x86_64-linux-gnu-g++]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/rossedman/strata/internal/cli.Version={{ .Version }}
      - -X github.com/rossedman/strata/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/rossedman/strata/internal/cli.Date={{ .Date }}
  - id: linux-arm64
    goos: [linux]
    goarch: [arm64]
    env: [CGO_ENABLED=1, CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    env: [CGO_ENABLED=1, CC=o64-clang, CXX=o64-clang++]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: darwin-arm64
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=1, CC=oa64-clang, CXX=oa64-clang++]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: windows-amd64
    goos: [windows]
    goarch: [amd64]
    env: [CGO_ENABLED=1, CC=x86_64-w64-mingw32-gcc, CXX=x86_64-w64-mingw32-g++]
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  extra_files:
    - glob: api/openapi.yaml

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore\(deps\):'
